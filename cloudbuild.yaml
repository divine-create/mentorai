# Push-to-deploy pipeline for AI Academy → Cloud Run.
#
# Connected via a Cloud Build GitHub trigger on `main`. Flow:
#   build backend → run DB migrations → deploy backend → build frontend
#   (baking the backend URL) → deploy frontend.
#
# Secrets live in Secret Manager and are referenced at deploy time with
# --set-secrets (never inlined here). Non-secret, env-specific values are passed
# as trigger SUBSTITUTIONS (see the bottom of this file for the list to set).

substitutions:
  _REGION: us-central1
  _AR_REPO: app                       # Artifact Registry docker repo
  _BACKEND_SERVICE: backend
  _FRONTEND_SERVICE: frontend
  _RUNTIME_SA: ""                     # backend runtime SA email (Vertex + secrets)
  _API_URL: ""                        # backend public URL (baked into frontend)
  _FRONTEND_URL: ""                   # frontend public URL (backend CORS)
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  _NEXT_PUBLIC_POSTHOG_KEY: ""
  _NEXT_PUBLIC_POSTHOG_HOST: "https://app.posthog.com"
  _POSTHOG_HOST: "https://app.posthog.com"
  _ADMIN_EMAILS: ""
  _EMAIL_FROM: "The AI Academy <onboarding@resend.dev>"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

steps:
  # 1) Build + push backend image
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest
      - .
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend"]

  # 2) Run DB migrations using the freshly built image (idempotent, tracked in _migrations)
  - id: migrate
    name: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
    entrypoint: node
    # Absolute path: Cloud Build overrides the image's WORKDIR with /workspace.
    args: ["/app/backend/dist/db/migrate.js"]
    secretEnv: ["DATABASE_URL"]
    env:
      - NODE_ENV=production

  # 3) Deploy backend to Cloud Run (secrets + env; attached runtime SA for Vertex ADC)
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=1
      - --timeout=3600
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest
      - --set-env-vars=^##^NODE_ENV=production##GOOGLE_CLOUD_PROJECT=$PROJECT_ID##GOOGLE_CLOUD_LOCATION=${_REGION}##FRONTEND_URL=${_FRONTEND_URL}##ADMIN_EMAILS=${_ADMIN_EMAILS}##EMAIL_FROM=${_EMAIL_FROM}##POSTHOG_HOST=${_POSTHOG_HOST}

  # 4) Build + push frontend image (NEXT_PUBLIC_* baked from substitutions)
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_KEY=${_NEXT_PUBLIC_POSTHOG_KEY}
      - --build-arg
      - NEXT_PUBLIC_POSTHOG_HOST=${_NEXT_PUBLIC_POSTHOG_HOST}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest
      - .
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend"]

  # 5) Deploy frontend to Cloud Run (no runtime secrets — all baked at build)
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA

# ── Substitutions to set on the Cloud Build trigger ──────────────────────────
# _RUNTIME_SA                  mentorai-run@<project>.iam.gserviceaccount.com
# _API_URL                     https://backend-xxxxx.us-central1.run.app (or api.<domain>)
# _FRONTEND_URL                https://frontend-xxxxx.us-central1.run.app (or app.<domain>)
# _NEXT_PUBLIC_SUPABASE_URL    https://<proj>.supabase.co
# _NEXT_PUBLIC_SUPABASE_ANON_KEY  <anon key> (public)
# _ADMIN_EMAILS                you@example.com
# (optional) _NEXT_PUBLIC_POSTHOG_KEY, _POSTHOG_HOST, _EMAIL_FROM
#
# Secret Manager secrets required (latest version):
#   DATABASE_URL, REDIS_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional secrets — if you use them, add to the backend --set-secrets line above:
#   ANTHROPIC_API_KEY, DEEPSEEK_API_KEY, RESEND_API_KEY, POSTHOG_API_KEY
